components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token obtained from POST /api/auth/login
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication passed as Bearer token or ApiKey token
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Internal nginx communication token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
    Success:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        version:
          type: string
        uptime:
          type: integer
    Deployment:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - running
          - stopped
          - error
          - deploying
        compose_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeploymentList:
      type: array
      items:
        $ref: '#/components/schemas/Deployment'
    Container:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        status:
          type: string
        state:
          type: string
        ports:
          type: array
          items:
            type: object
    ContainerList:
      type: array
      items:
        $ref: '#/components/schemas/Container'
    Image:
      type: object
      properties:
        id:
          type: string
        repository:
          type: string
        tag:
          type: string
        size:
          type: integer
        created:
          type: string
          format: date-time
    ImageList:
      type: array
      items:
        $ref: '#/components/schemas/Image'
    Volume:
      type: object
      properties:
        name:
          type: string
        driver:
          type: string
        mountpoint:
          type: string
        size:
          type: integer
    VolumeList:
      type: array
      items:
        $ref: '#/components/schemas/Volume'
    Network:
      type: object
      properties:
        name:
          type: string
        id:
          type: string
        driver:
          type: string
        scope:
          type: string
    NetworkList:
      type: array
      items:
        $ref: '#/components/schemas/Network'
    Certificate:
      type: object
      properties:
        domain:
          type: string
        issuer:
          type: string
        expires_at:
          type: string
          format: date-time
        auto_renew:
          type: boolean
        status:
          type: string
    CertificateList:
      type: array
      items:
        $ref: '#/components/schemas/Certificate'
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - viewer
        created_at:
          type: string
          format: date-time
    UserList:
      type: array
      items:
        $ref: '#/components/schemas/User'
    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
    APIKeyList:
      type: array
      items:
        $ref: '#/components/schemas/APIKey'
    Backup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
    BackupList:
      type: array
      items:
        $ref: '#/components/schemas/Backup'
    ScheduledTask:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cron:
          type: string
        action:
          type: string
        enabled:
          type: boolean
        last_run:
          type: string
          format: date-time
    ScheduledTaskList:
      type: array
      items:
        $ref: '#/components/schemas/ScheduledTask'
    SecurityEvent:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        source_ip:
          type: string
        severity:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time
    SecurityEventList:
      type: array
      items:
        $ref: '#/components/schemas/SecurityEvent'
    TrafficLog:
      type: object
      properties:
        id:
          type: integer
        domain:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        bytes:
          type: integer
        timestamp:
          type: string
          format: date-time
    TrafficLogList:
      type: array
      items:
        $ref: '#/components/schemas/TrafficLog'
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        actor:
          type: string
        resource:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time
    AuditEventList:
      type: array
      items:
        $ref: '#/components/schemas/AuditEvent'
    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        changes:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
    PlanList:
      type: array
      items:
        $ref: '#/components/schemas/Plan'
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
tags:
- name: authentication
  description: Authentication endpoints for login, token validation, and auth status.
- name: setup
  description: Initial server setup and configuration endpoints. Only accessible before
    setup is complete.
- name: deployments
  description: Deployment lifecycle management including create, start, stop, restart,
    and file management.
- name: services
  description: 'Per-service actions within a deployment: start, stop, restart, rebuild.'
- name: networks
  description: 'Docker network management: create, delete, connect, disconnect.'
- name: certificates
  description: SSL/TLS certificate management with Let's Encrypt support and auto-renewal.
- name: proxy
  description: Reverse proxy setup and management for deployments.
- name: containers
  description: 'Container lifecycle management: start, stop, restart, exec, logs,
    stats.'
- name: images
  description: 'Docker image management: list, pull, remove, cleanup.'
- name: volumes
  description: 'Docker volume management: create, list, remove, prune.'
- name: ports
  description: Port and process management.
- name: system_services
  description: System service management on the host.
- name: system_files
  description: System-level file management (admin only).
- name: settings
  description: Application settings configuration.
- name: config
  description: Low-level configuration key-value store.
- name: plans
  description: Deployment plan management. Plans represent pending or previewed changes.
- name: ai
  description: AI assistant for system analysis and deployment management.
- name: templates
  description: Deployment template management with compose generation.
- name: plugins
  description: Plugin registry for extending deployment functionality.
- name: databases
  description: 'Database server management: create, query, user management, privileges.'
- name: infrastructure
  description: Infrastructure service management for external services.
- name: registries
  description: Container registry type management.
- name: credentials
  description: Credential management for registry authentication.
- name: security
  description: Security event monitoring, IP blocking, whitelist, and WAF management.
- name: traffic
  description: Traffic logging and analytics.
- name: backups
  description: Backup creation, restoration, and management.
- name: scheduler
  description: Scheduled task management with cron-based execution.
- name: audit
  description: Audit event logging and export.
- name: users
  description: User management with role-based access control.
- name: api_keys
  description: API key management for programmatic access.
- name: dns
  description: DNS provider and zone management with PowerDNS support.
- name: cluster
  description: Multi-server cluster management for distributed deployments.
- name: websockets
  description: WebSocket endpoints for real-time streaming (terminal, logs, exec).
- name: internal
  description: Internal endpoints for nginx integration and cross-service communication.
- name: system
  description: System health, stats, and server information endpoints.
