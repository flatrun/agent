server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        # Capture security events via Lua
        log_by_lua_block {
            security.capture_event()
        }

        return 404;
    }

    # Test endpoint that returns 403
    location /admin {
        log_by_lua_block {
            security.capture_event()
        }
        return 403;
    }

    # Test endpoint that returns 401
    location /api/private {
        log_by_lua_block {
            security.capture_event()
        }
        return 401;
    }

    # Test endpoint that returns 500
    location /error {
        log_by_lua_block {
            security.capture_event()
        }
        return 500;
    }
}
