worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dictionary for security events
    lua_shared_dict security_events 10m;
    lua_shared_dict ip_rate_limit 10m;
    lua_shared_dict blocked_ips 5m;

    # Load security module
    init_by_lua_block {
        security = require "security"
    }

    # Initialize blocked IPs cache on worker start
    init_worker_by_lua_block {
        security.init_blocked_ips()
    }

    # Check blocked IPs on every request
    access_by_lua_block {
        if security.is_blocked(ngx.var.remote_addr) then
            ngx.exit(ngx.HTTP_FORBIDDEN)
        end
    }

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    include /tmp/flatrun-e2e-lua/nginx/conf.d/rate_limits.conf;

    # Default configs
    include /etc/nginx/conf.d/*.conf;

    # Internal API server for security operations (not exposed externally)
    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location /_internal/security/block-ip {
            content_by_lua_block {
                security.handle_block_ip_request()
            }
        }

        location /_internal/security/unblock-ip {
            content_by_lua_block {
                security.handle_unblock_ip_request()
            }
        }

        location /_internal/security/refresh-blocked-ips {
            content_by_lua_block {
                security.handle_refresh_request()
            }
        }

        location /_internal/health {
            content_by_lua_block {
                ngx.say("OK")
            }
        }
    }
}
