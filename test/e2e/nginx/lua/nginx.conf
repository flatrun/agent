worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dictionary for security events
    lua_shared_dict security_events 10m;
    lua_shared_dict ip_rate_limit 10m;

    # Load security module
    init_by_lua_block {
        security = require "security"
    }

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Include blocked IPs (if exists)
    include /tmp/flatrun-e2e-lua/nginx/conf.d/blocked_ips.conf;

    # Include rate limit zones (if exists)
    include /tmp/flatrun-e2e-lua/nginx/conf.d/rate_limits.conf;

    # Default configs
    include /etc/nginx/conf.d/*.conf;
}
