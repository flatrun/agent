server {
    listen 80 default_server;
    server_name _;

    location /health {
        return 200 'nginx healthy';
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404 'No virtual host configured for this domain';
        add_header Content-Type text/plain;
    }
}
