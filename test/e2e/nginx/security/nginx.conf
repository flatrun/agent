user nginx;
worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 128;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Include rate limit zones (required for security feature)
    include /tmp/flatrun-e2e-security/nginx/conf.d/rate_limits.conf;

    # Default configs
    include /etc/nginx/conf.d/*.conf;

    # Dynamic virtual hosts from FlatRun deployments
    include /tmp/flatrun-e2e-security/nginx/conf.d/*.conf;
}
