name: flatrun-e2e-security

services:
  agent:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.security
    container_name: flatrun-e2e-security-agent
    ports:
      - "18091:8090"
    volumes:
      - /tmp/flatrun-e2e-security:/tmp/flatrun-e2e-security
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 2s
      timeout: 5s
      retries: 15

  nginx:
    image: nginx:alpine
    container_name: flatrun-e2e-security-nginx
    ports:
      - "18081:80"
    volumes:
      - ./nginx/security/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/flatrun-e2e-security/nginx/conf.d:/tmp/flatrun-e2e-security/nginx/conf.d:ro
    networks:
      - proxy
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 5s
      retries: 10

networks:
  proxy:
    external: true
