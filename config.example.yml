deployments_path: /home/nfebe/flatrun/deployments
system_files_root: /
docker_socket: unix:///var/run/docker.sock
default_timeout: 2m0s
api:
    host: 0.0.0.0
    port: 8090
    enable_cors: true
    allowed_origins:
        - http://localhost:5173
        - http://localhost:3000
        - http://127.0.0.1:5173
auth:
    enabled: true
    api_keys:
        - your-api-key-here
    jwt_secret: generate-a-secure-random-string-here
domain:
    default_domain: ""
    auto_subdomain: false
    auto_ssl: false
    subdomain_style: words
nginx:
    enabled: true
    image: nginx:alpine
    container_name: nginx
    config_path: ""
    reload_command: nginx -s reload
    external: false
    container_webroot_path: ""
    reject_unknown_domains: false
certbot:
    enabled: true
    image: certbot/certbot
    email: engineering@whilesmart.com
    staging: true
    certs_path: ""
    webroot_path: ""
    container_webroot_path: ""
    dns_provider: ""
    auto_renewal_enabled: true
    renewal_threshold_days: 30
    renewal_check_interval: 12h0m0s
logging:
    level: info
    format: json
health:
    check_interval: 30s
    metrics_retention: 24h0m0s
infrastructure:
    default_proxy_network: proxy
    default_database_network: database
    database:
        enabled: true
        type: mysql
        container: ""
        host: ""
        port: 3306
        root_user: root
        root_password: ""
    redis:
        enabled: false
        container: ""
        host: ""
        port: 6379
        password: ""
    powerdns:
        enabled: false
        container: powerdns
        image: powerdns/pdns-auth-48:latest
        api_port: 8081
        dns_port: 53
        api_key: your-powerdns-api-key-here
        data_path: ""
        default_soa: ""
        nameservers: ""
security:
    enabled: true
    realtime_capture: false
    scan_interval: 30s
    retention_days: 30
    rate_threshold: 100
    auto_block_enabled: true
    auto_block_threshold: 50
    auto_block_duration: 24h0m0s
    detection_window: 2m0s
    not_found_threshold: 10
    auth_failure_threshold: 5
    unique_paths_threshold: 20
    repeated_hits_threshold: 30
    internal_api_token: generate-a-secure-random-string-here
    trusted_proxies: []
    trust_cf_header: false
audit:
    enabled: false
    retention_days: 30
    capture_request_body: false
    excluded_paths:
        - /api/health
    sensitive_fields:
        - password
        - token
        - secret
        - api_key
        - authorization
    cleanup_interval: 24h0m0s
cluster:
    enabled: false
    server_name: nfebe-zenbk-duo
    advertise_url: ""
    health_interval: 30s
    request_timeout: 10s
system_terminal:
    protected_mode:
        enabled: false
cleanup:
    timeout: 2m0s
files:
    show_hidden: true
plans:
    ttl: 24h0m0s
    retention_days: 30
ai:
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: your-gemini-api-key-here
    model: gemini-2.5-flash
    timeout: 1m0s
