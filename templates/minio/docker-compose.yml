name: ${NAME}
services:
  minio:
    image: minio/minio:latest
    container_name: ${NAME}
    user: "${FLATRUN_UID:-1000}:${FLATRUN_GID:-1000}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flatrun}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - ./data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - objstore
    restart: unless-stopped

networks:
  objstore:
    external: true
    name: ${FLATRUN_OBJECT_NETWORK:-database}
