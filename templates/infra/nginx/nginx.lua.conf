worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # The host leads every line so an access line says which site it belongs to; one proxy
    # serves every deployment, and without it the log cannot be read per deployment.
    log_format main '$host $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 2048;

    # HTTP/1.1 to upstreams on every proxied location, not just the primary route.
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml application/wasm application/manifest+json font/woff font/woff2 image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dictionaries for security
    lua_shared_dict security_events 10m;
    lua_shared_dict ip_rate_limit 10m;
    lua_shared_dict blocked_ips 5m;
    lua_shared_dict whitelist 5m;

    # Load Lua modules
    init_by_lua_block {
        security = require "security"
        traffic = require "traffic"
    }

    # Initialize caches on worker start
    init_worker_by_lua_block {
        security.init_blocked_ips()
        security.init_whitelist()
    }

    # Check blocked IPs on every request (uses real client IP from headers)
    access_by_lua_block {
        if security.is_blocked(security.get_client_ip()) then
            ngx.exit(ngx.HTTP_FORBIDDEN)
        end
    }

    # Global traffic logging - logs ALL requests
    log_by_lua_block {
        traffic.log_request()
    }

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    include /etc/nginx/conf.d/rate_limits.conf;

    # Include virtual hosts
    include /etc/nginx/conf.d/*.conf;

    # Internal API server for security operations (not exposed externally)
    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location /_internal/security/block-ip {
            content_by_lua_block {
                security.handle_block_ip_request()
            }
        }

        location /_internal/security/unblock-ip {
            content_by_lua_block {
                security.handle_unblock_ip_request()
            }
        }

        location /_internal/security/refresh-blocked-ips {
            content_by_lua_block {
                security.handle_refresh_request()
            }
        }

        location /_internal/health {
            content_by_lua_block {
                ngx.say("OK")
            }
        }
    }
{{if .RejectUnknownDomains}}
    # Reject requests to unknown domains
    server {
        listen 80 default_server;
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_reject_handshake on;

        return 444;
    }
{{end}}
}
