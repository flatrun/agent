<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{STATUS_CODE}} · {{TITLE}}</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f7f8fc;
        --surface: #ffffff;
        --surface-soft: #f1f3fa;
        --ink: #151823;
        --ink-soft: #62677a;
        --rule: #e1e4ee;
        --brand: #3157d5;
        --brand-deep: #2444ae;
        --danger: #c83b4b;
        --danger-soft: #fcecef;
        --radius-card: 14px;
        --radius-pill: 999px;
        --elevation-2: 0 1px 2px rgba(20, 24, 35, 0.05), 0 10px 32px rgba(20, 24, 35, 0.08);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(49, 87, 213, 0.1), transparent 32%),
          var(--page);
        font-family: Ubuntu, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 560px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px 4px;
        color: var(--brand-deep);
        font-size: 18px;
        font-weight: 700;
      }
      .brand svg {
        width: 32px;
        height: 32px;
      }
      .card {
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--elevation-2);
      }
      .content {
        padding: clamp(28px, 7vw, 48px);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        padding: 7px 12px;
        border-radius: var(--radius-pill);
        color: var(--danger);
        background: var(--danger-soft);
        font-size: 13px;
        font-weight: 700;
      }
      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.025em;
      }
      .message {
        margin: 0;
        color: var(--ink-soft);
        font-size: 16px;
        line-height: 1.65;
      }
      .incident {
        margin-top: 28px;
        padding: 16px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--surface-soft);
      }
      .incident span {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .incident code {
        color: var(--ink);
        font-family: "Ubuntu Mono", ui-monospace, monospace;
        font-size: 17px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      footer {
        padding: 14px 20px;
        border-top: 1px solid var(--rule);
        color: var(--ink-soft);
        background: var(--surface-soft);
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        .content {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 244 244" aria-hidden="true">
          <path
            fill="currentColor"
            d="M187.65 3.55c12.1-1.96 23.5 6.26 25.46 18.36l26.82 165.74c1.96 12.1-6.27 23.5-18.37 25.46L55.82 239.93c-12.1 1.96-23.5-6.27-25.46-18.37L3.55 55.82c-1.96-12.1 6.26-23.5 18.36-25.46L187.65 3.55Zm-9.02 163.54c-1.52 2.06-3.8 3.01-6.36 3.05l-101.9-.03c-2.14-.16-4.91-1.5-5.99-3.41-.43-.74-.29-1.96-.97-2.23v23.5c0 3.65 6.13 9.24 9.96 9.21h96.48c4.28-.09 10.12-5.47 10.12-9.59v-23.13l-1.34 2.62Zm0-33.08c-1.47 1.94-3.65 2.72-6 3.03l-101.15.02c-2.56-.09-5.15-.96-6.73-3.05l-1.34-2.61v23.13c0 4.16 6.52 9.76 10.73 9.58l94.38.03c4.45.54 11.45-5.22 11.45-9.61V131.4l-1.34 2.61Zm0-33.09c-1.41 2.02-4.08 2.61-6.37 3.03-34.5-.36-69.19.75-103.59-.56-1.54-.41-2.97-1.15-3.92-2.47l-1.34-2.6v23.13c0 4.45 7.27 10.23 11.82 9.6l93.63-.02c4.31.32 11.1-5.39 11.1-9.58V98.32l-1.33 2.6Zm-37.58-61.63c-12.36-1.24-26.8.83-39.38.09-5.62 1.19-10.85 4.5-13.88 9.43-7.45 12.14-12.71 27.4-19.88 39.9-1.45 5.16.98 8.42 6.21 8.87h95.15c4.59-.39 7.19-2.92 6.53-7.69-6.92-12.92-12.6-28.69-20.21-41.08-2.86-4.66-9-8.97-14.54-9.52Z"
          />
        </svg>
        FlatRun
      </div>
      <section class="card">
        <div class="content">
          <div class="status">Error {{STATUS_CODE}}</div>
          <h1>{{TITLE}}</h1>
          <p class="message">{{MESSAGE}}</p>
          <div class="incident">
            <span>Incident ID</span>
            <code>{{INCIDENT_ID}}</code>
          </div>
        </div>
        <footer>Served by FlatRun</footer>
      </section>
    </main>
  </body>
</html>
