name: ${NAME}
services:
  wordpress:
    image: wordpress:latest
    container_name: ${NAME}
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST:-db}
      WORDPRESS_DB_USER: ${DB_USERNAME:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: ${DB_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
    expose:
      - "80"
    networks:
      - proxy
    restart: unless-stopped

volumes:
  wordpress_data:

networks:
  proxy:
    external: true
