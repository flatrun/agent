name: WordPress
description: Popular content management system
icon: pi pi-globe
logo: https://s.w.org/style/images/about/WordPress-logotype-wmark.png
category: application
priority: 100
container_port: 80
mounts:
  - id: full
    name: Full WordPress
    container_path: /var/www/html
    description: Entire WordPress installation
    type: file
    required: false
  - id: wp_config
    name: WordPress Config
    container_path: /var/www/html/wp-config.php
    description: WordPress configuration file with database credentials
    type: file
    required: true
  - id: wp_content
    name: Content Directory
    container_path: /var/www/html/wp-content
    description: Themes, plugins, and uploads
    type: file
    required: false
  - id: plugins
    name: Plugins
    container_path: /var/www/html/wp-content/plugins
    description: WordPress plugins
    type: file
    required: false
  - id: uploads
    name: Uploads
    container_path: /var/www/html/wp-content/uploads
    description: Media uploads
    type: volume
    required: true
files:
  - path: wp-config.php
    content: |
      <?php
      define( 'DB_NAME', '${DB_DATABASE}' );
      define( 'DB_USER', '${DB_USERNAME}' );
      define( 'DB_PASSWORD', '${DB_PASSWORD}' );
      define( 'DB_HOST', '${DB_HOST}' );
      define( 'DB_CHARSET', 'utf8mb4' );
      define( 'DB_COLLATE', '' );

      $table_prefix = 'wp_';

      define( 'AUTH_KEY',         'put your unique phrase here' );
      define( 'SECURE_AUTH_KEY',  'put your unique phrase here' );
      define( 'LOGGED_IN_KEY',    'put your unique phrase here' );
      define( 'NONCE_KEY',        'put your unique phrase here' );
      define( 'AUTH_SALT',        'put your unique phrase here' );
      define( 'SECURE_AUTH_SALT', 'put your unique phrase here' );
      define( 'LOGGED_IN_SALT',   'put your unique phrase here' );
      define( 'NONCE_SALT',       'put your unique phrase here' );

      define( 'WP_DEBUG', false );

      if ( ! defined( 'ABSPATH' ) ) {
        define( 'ABSPATH', __DIR__ . '/' );
      }

      require_once ABSPATH . 'wp-settings.php';
