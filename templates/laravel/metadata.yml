name: Laravel
description: PHP framework for web artisans
icon: pi pi-code
logo: https://cdn.simpleicons.org/laravel
category: framework
priority: 80
container_port: 8000
quick_actions:
  - id: optimize
    name: Optimize
    command: php artisan optimize
    description: Clear and rebuild all caches
    icon: pi pi-bolt
  - id: migrate
    name: Run Migrations
    command: php artisan migrate --force
    description: Run database migrations
    icon: pi pi-database
  - id: cache-clear
    name: Clear Cache
    command: php artisan cache:clear
    description: Flush the application cache
    icon: pi pi-trash
  - id: config-clear
    name: Clear Config
    command: php artisan config:clear
    description: Remove the configuration cache file
    icon: pi pi-cog
mounts:
  - id: app
    name: Application
    container_path: /app
    description: Laravel application source code
    type: file
    required: true
  - id: env
    name: Environment Config
    container_path: /app/.env
    description: Laravel environment configuration file
    type: file
    required: true
  - id: storage
    name: Storage
    container_path: /app/storage
    description: Logs, cache, and file uploads
    type: volume
    required: false
files:
  - path: .env
    content: |
      APP_NAME=${NAME}
      APP_ENV=production
      APP_DEBUG=false
      APP_URL=http://localhost

      DB_CONNECTION=mysql
      DB_HOST=${DB_HOST}
      DB_PORT=${DB_PORT}
      DB_DATABASE=${DB_DATABASE}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}

      CACHE_DRIVER=file
      SESSION_DRIVER=file
      QUEUE_CONNECTION=sync
backup:
  container_paths:
    - service: app
      container_path: /app/storage
      description: Storage directory (logs, cache, uploads)
      required: true
    - service: app
      container_path: /app/.env
      description: Environment configuration
      required: true
  databases:
    - service: app
      type: mysql
      host_env: DB_HOST
      port_env: DB_PORT
      user_env: DB_USERNAME
      password_env: DB_PASSWORD
      database_env: DB_DATABASE
  pre_hooks:
    - service: app
      command: php artisan down --retry=60
      timeout: 30
  post_hooks:
    - service: app
      command: php artisan up
      timeout: 30
