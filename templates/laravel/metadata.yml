name: Laravel
description: PHP framework for web artisans
icon: pi pi-code
logo: https://laravel.com/img/logomark.min.svg
category: framework
priority: 80
container_port: 8000
mounts:
  - id: app
    name: Application
    container_path: /app
    description: Laravel application source code
    type: file
    required: true
  - id: env
    name: Environment Config
    container_path: /app/.env
    description: Laravel environment configuration file
    type: file
    required: true
  - id: storage
    name: Storage
    container_path: /app/storage
    description: Logs, cache, and file uploads
    type: volume
    required: false
files:
  - path: .env
    content: |
      APP_NAME=${NAME}
      APP_ENV=production
      APP_DEBUG=false
      APP_URL=http://localhost

      DB_CONNECTION=mysql
      DB_HOST=${DB_HOST}
      DB_PORT=${DB_PORT}
      DB_DATABASE=${DB_DATABASE}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}

      CACHE_DRIVER=file
      SESSION_DRIVER=file
      QUEUE_CONNECTION=sync
