name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o flatrun-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o flatrun-linux-arm64 ./cmd/agent

      - name: Test
        run: go test -v ./...

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: flatrun-linux-amd64
          path: flatrun-linux-amd64
          retention-days: 30

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: flatrun-linux-arm64
          path: flatrun-linux-arm64
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
