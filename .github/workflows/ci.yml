name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o flatrun-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o flatrun-linux-arm64 ./cmd/agent

      - name: Unit Tests
        run: make test-unit

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: flatrun-linux-amd64
          path: flatrun-linux-amd64
          retention-days: 30

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: flatrun-linux-arm64
          path: flatrun-linux-arm64
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start E2E environment
        run: make test-e2e-setup

      - name: Run E2E tests
        run: make test-e2e-run

      - name: Cleanup E2E environment
        if: always()
        run: make test-e2e-cleanup

  security-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Security E2E tests
        run: make test-e2e-security

      - name: Cleanup on failure
        if: failure()
        run: make test-e2e-security-cleanup

  lua-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Lua/OpenResty E2E tests
        run: make test-e2e-lua

      - name: Cleanup on failure
        if: failure()
        run: make test-e2e-lua-cleanup
