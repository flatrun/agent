name: Runner Image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build runner image
        run: docker build --tag ghcr.io/flatrun/runner:${{ github.sha }} images/runner
      - name: Check tools, PostgreSQL, sudo policy and cache reuse
        run: bash images/runner/test.sh ghcr.io/flatrun/runner:${{ github.sha }}
      - name: Publish image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push ghcr.io/flatrun/runner:${{ github.sha }}
